aid: assured
name: Assured
description: >-
  Assured is an AI platform for end-to-end property and casualty (P&C) insurance
  claims processing, positioning itself as the most widely deployed AI in P&C and
  processing tens of millions of claims annually. Its modular, interconnected
  products span the claims lifecycle: FNOL (First Notice of Loss) digital intake,
  Voice AI telephonic intake, First Contact document gathering, Service Assignment
  contractor scheduling, omnichannel Messaging, the Emma agentic claim-analysis
  assistant, the Sidekick telephonic FNOL assistant for adjusters, Fraud Detection,
  and CAT catastrophe triage. The platform is model-agnostic (working across
  multiple frontier AI providers), with claims-specific safety controls,
  explainability, human-in-the-loop workflows, and enterprise-grade monitoring and
  guardrails. Assured serves personal and commercial auto, homeowners, commercial
  property, and workers' compensation lines. It is an enterprise, sales-led product
  and does not publish a public developer API, OpenAPI, or self-serve documentation.
  Backed by Costanoa Ventures, DCM Ventures, ICONIQ Capital, Kindred Ventures, and
  Kleiner Perkins.
